services:
  piano:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-piano-learning-app:local}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_PATH: ${DB_PATH:-/app/data/piano.db}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
    volumes:
      - ${DATA_VOLUME:-piano_data}:/app/data
    networks:
      - piano_net

networks:
  piano_net:
    name: ${EXTERNAL_NETWORK:-piano_default}
    external: ${USE_EXTERNAL_NETWORK:-false}

volumes:
  piano_data:
